<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Défis Photobooth Noël</title>
<meta name="theme-color" content="#7a0d1b">
<script>
  // Si le téléphone affiche la page en « version ordinateur », on la recale sur la largeur réelle de l'écran.
  (function () {
    var w = screen.width;
    if (navigator.maxTouchPoints > 0 && w < 700 && window.innerWidth > w * 1.4) {
      document.documentElement.classList.add('mode-pc');
      document.documentElement.style.setProperty('--k', window.innerWidth / w);
    }
  })();
</script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mountains+of+Christmas:wght@700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  /* Conte de Noël : velours rouge et neige blanche, lune, traîneau qui traverse le ciel,
     Père Noël et bonhomme de neige posés sur la carte. Thème pensé pour l'écran du photobooth. */
  :root {
    color-scheme: dark;
    --velours: #9b1022;
    --nuit: #3a0610;
    --rouge: #d62839;
    --rouge-fonce: #8f0f1f;
    --or: #f5c451;
    --or-clair: #ffe39a;
    --neige: #fffaf5;
    --rose-givre: #ffd9de;
    --display: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --conte: 'Mountains of Christmas', 'Fredoka', serif;
    --texte: 'Outfit', system-ui, -apple-system, sans-serif;
    --fig: clamp(64px, 11dvh, 88px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--nuit); }
  body {
    font-family: var(--texte);
    min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(70% 40% at 88% 6%, rgba(255,240,215,.22) 0%, transparent 60%),
      radial-gradient(120% 70% at 50% 0%, #c21d31 0%, transparent 62%),
      radial-gradient(90% 60% at 50% 110%, #6e0c1a 0%, transparent 65%),
      linear-gradient(180deg, var(--velours), var(--nuit));
    background-color: var(--nuit);
    background-attachment: fixed;
    color: var(--neige);
    text-align: center;
    display: flex; justify-content: center;
    overflow-x: hidden;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  html.mode-pc body { width: calc(100vw / var(--k)); min-height: calc(100vh / var(--k)); transform: scale(var(--k)); transform-origin: 0 0; }

  .decor { position: fixed; pointer-events: none; z-index: 0; }
  #neige { inset: 0; width: 100%; height: 100%; }
  .fond { inset: 0; width: 100%; height: 100%; }
  .givre { top: 0; left: 0; width: 100%; height: clamp(20px, 3.4dvh, 30px); filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
  .sol { bottom: 0; left: 0; width: 100%; height: clamp(56px, 10dvh, 96px); }
  .traineau {
    top: clamp(6px, 2dvh, 18px); left: 0; width: clamp(170px, 46vw, 250px); height: auto;
    filter: drop-shadow(0 0 6px rgba(245,196,81,.6));
    animation: vol 18s linear infinite; animation-delay: 1.5s; transform: translateX(-120%);
  }
  @keyframes vol {
    0%   { transform: translate(-120%, 40px) rotate(-3deg); opacity: 0; }
    4%   { opacity: .95; }
    40%  { transform: translate(calc(100vw + 10%), -10px) rotate(-7deg); opacity: .95; }
    41%, 100% { transform: translate(calc(100vw + 10%), -10px); opacity: 0; }
  }
  .etoile { transform-box: fill-box; transform-origin: center; animation: scintille 3s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes scintille { 0%,100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }

  main { position: relative; z-index: 1; width: 100%; max-width: 420px; min-height: calc(100dvh - max(12px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom))); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 14px); }
  .jeu { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 14px); margin-block: auto; }
  header { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }

  /* Logo en blanc, posé sous la frange de neige */
  .plaque {
    margin-top: clamp(34px, 6dvh, 54px);
    margin-bottom: clamp(4px, 1dvh, 10px);
  }
  .logo {
    display: block; width: clamp(170px, 25dvh, 240px); max-width: 66vw; height: auto;
    filter: brightness(0) invert(1) drop-shadow(0 0 12px rgba(245,196,81,.45)) drop-shadow(0 2px 6px rgba(0,0,0,.45));
  }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.1rem, 6dvh, 2.9rem); line-height: 1; letter-spacing: .01em; text-wrap: balance;
    color: var(--neige);
    text-shadow: 0 3px 0 var(--rouge-fonce), 0 6px 0 #4a0710, 0 10px 18px rgba(0,0,0,.4);
    animation: rebond 3.2s ease-in-out infinite;
  }
  h1 .j {
    display: block; font-family: var(--conte); font-weight: 700; font-size: .82em; letter-spacing: .03em;
    color: var(--or); margin-top: .12em;
    text-shadow: 0 2px 0 #7a4a00, 0 0 18px rgba(245,196,81,.55);
  }
  @keyframes rebond { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg) translateY(-3px); } }
  .titres { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }
  .subtitle { font-size: clamp(.95rem, 2.3dvh, 1.05rem); color: var(--rose-givre); }

  /* Les personnages se tiennent derrière la carte, comme s'ils dépassaient d'un mur de neige */
  .piece { position: relative; width: 100%; margin: calc(var(--fig) * 1.1) 0 clamp(6px, 1.6dvh, 16px); }
  .perso { position: absolute; bottom: calc(100% - 20px); height: auto; z-index: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .bonhomme { left: 6px; width: calc(var(--fig) * .95); transform-origin: 50% 100%; animation: dandine 3.6s ease-in-out infinite; }
  .pere-noel { right: 2px; width: calc(var(--fig) * 1.1); }
  .bras { transform-box: view-box; transform-origin: 74px 94px; animation: salut 1.4s ease-in-out infinite; }
  @keyframes salut { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-14deg); } }
  @keyframes dandine { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  .card {
    position: relative; z-index: 1;
    width: 100%;
    min-height: clamp(140px, 22dvh, 200px);
    display: flex; align-items: center; justify-content: center;
    padding: 22px 20px 20px;
    font-family: var(--texte); font-size: clamp(1.25rem, 3dvh, 1.55rem); font-weight: 700; line-height: 1.35;
    text-wrap: balance; overflow-wrap: anywhere;
    color: var(--rouge-fonce);
    border: 7px solid transparent; border-radius: 26px;
    background:
      linear-gradient(170deg, #ffffff, #fff1f3) padding-box,
      repeating-linear-gradient(45deg, var(--rouge) 0 10px, #ffffff 10px 20px) border-box;
    box-shadow: 0 14px 40px rgba(0,0,0,.42), 0 0 0 2px rgba(255,255,255,.25);
    transition: transform .4s cubic-bezier(.175,.885,.32,1.275), box-shadow .3s;
  }
  /* Couche de neige posée sur le haut de la carte */
  .card::before {
    content: ''; position: absolute; left: 14px; right: 14px; top: -13px; height: 18px;
    background: radial-gradient(circle at 11px 13px, #fff 10px, transparent 11px) repeat-x;
    background-size: 20px 18px;
    filter: drop-shadow(0 2px 2px rgba(120,20,30,.25));
  }
  .card.placeholder { font-weight: 500; color: #b0606b; }
  .card.stopped { transform: scale(1.04) rotate(-1deg); box-shadow: 0 0 0 3px var(--or), 0 0 42px rgba(245,196,81,.6), 0 14px 40px rgba(0,0,0,.42); }

  button {
    width: 100%; min-height: 60px; margin-top: 4px; padding: 16px 0;
    font-family: var(--display); font-size: 1.35rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--rouge);
    background: linear-gradient(180deg, #ffffff 0%, #fff4f5 55%, #ffd9de 100%);
    border: none; border-radius: 50px; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    box-shadow: 0 6px 0 #b8707a, 0 12px 24px rgba(0,0,0,.35), inset 0 1px 0 #fff;
    transition: transform .2s, box-shadow .3s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8707a, 0 6px 14px rgba(0,0,0,.35); }
  button:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
  @media (hover: hover) { button:hover { box-shadow: 0 8px 0 #b8707a, 0 14px 28px rgba(0,0,0,.35), inset 0 1px 0 #fff; transform: translateY(-2px); } }
  button.running { color: #5a2a00; background: linear-gradient(180deg, var(--or-clair) 0%, var(--or) 55%, #d99a1e 100%); box-shadow: 0 6px 0 #8a5a0a, 0 12px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.6); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .traineau { display: none; }
  }
</style>

<script>
  // Neige qui tombe doucement, avec quelques flocons cristaux qui tournent et des lueurs dorées floues
  (function () {
    const c = document.getElementById('neige');
    const ctx = c.getContext('2d');
    const lueurs = ['245,196,81', '255,255,255', '255,217,222'];
    const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, flocons = [], halos = [];
    function taille() {
      const r = Math.min(devicePixelRatio || 1, 2);
      W = c.clientWidth; H = c.clientHeight; c.width = W * r; c.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0);
      const n = Math.round(Math.min(150, Math.max(55, W * H / 8500)));
      flocons = Array.from({ length: n }, () => {
        const cristal = Math.random() < .12;
        return {
          x: Math.random() * W, y: Math.random() * H, cristal,
          r: cristal ? 4 + Math.random() * 4.5 : .8 + Math.random() * 2.6,
          a: cristal ? .55 + Math.random() * .35 : .35 + Math.random() * .55,
          vy: cristal ? .35 + Math.random() * .5 : .3 + Math.random() * .9,
          balance: .3 + Math.random() * .8, p: Math.random() * 6.28,
          rot: Math.random() * 6.28, vr: (Math.random() - .5) * .012
        };
      });
      halos = Array.from({ length: 9 }, () => ({
        x: Math.random() * W, y: Math.random() * H, r: 24 + Math.random() * 50,
        a: .05 + Math.random() * .08, t: lueurs[Math.floor(Math.random() * lueurs.length)], p: Math.random() * 6.28
      }));
    }
    function cristal(f) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.strokeStyle = `rgba(255,255,255,${f.a})`; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        ctx.rotate(Math.PI / 3);
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(0, -f.r);
        ctx.moveTo(0, -f.r * .55); ctx.lineTo(f.r * .28, -f.r * .82);
        ctx.moveTo(0, -f.r * .55); ctx.lineTo(-f.r * .28, -f.r * .82);
        ctx.stroke();
      }
      ctx.restore();
    }
    function dessiner(temps) {
      ctx.clearRect(0, 0, W, H);
      for (const h of halos) {
        const a = h.a * (.7 + .3 * Math.sin(temps / 900 + h.p));
        const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
        g.addColorStop(0, `rgba(${h.t},${a})`); g.addColorStop(1, `rgba(${h.t},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.283); ctx.fill();
      }
      for (const f of flocons) {
        if (!calme) {
          f.y += f.vy;
          f.x += Math.sin(temps / 1200 + f.p) * f.balance * .4;
          f.rot += f.vr;
          if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
        }
        if (f.cristal) { cristal(f); continue; }
        ctx.fillStyle = `rgba(255,255,255,${f.a})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
      }
      if (!calme) requestAnimationFrame(dessiner);
    }
    taille(); addEventListener('resize', taille); requestAnimationFrame(dessiner);
  })();
</script>

    // ---- Pioche mélangée ----
    // Les défis sont mélangés comme un jeu de cartes (mélange de Fisher-Yates, avec le générateur
    // aléatoire sécurisé du navigateur). On pioche dans l'ordre : aucun défi ne revient avant que
    // tous soient passés. La pioche est mémorisée sur l'appareil : elle survit à un rechargement
    // de la page (par exemple après le QR code), donc on ne repart pas toujours des mêmes défis.
    const CLE = 'defis-noel-pioche-v1';
    let pioche = [];   // défis dans l'ordre du mélange
    let position = 0;  // prochain défi à tirer

    function hasard(n) {
      // Entier aléatoire équitable entre 0 et n-1
      if (window.crypto && crypto.getRandomValues) {
        const max = Math.floor(0x100000000 / n) * n;
        const buf = new Uint32Array(1);
        do { crypto.getRandomValues(buf); } while (buf[0] >= max);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function melanger(liste) {
      const a = [...liste];
      for (let i = a.length - 1; i > 0; i--) {
        const j = hasard(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sauver() {
      try { localStorage.setItem(CLE, JSON.stringify({ pioche, position })); } catch (e) {}
    }

    function nouvellePioche(dernier) {
      pioche = melanger(tousLesDefis);
      // Le premier défi du nouveau tour ne doit pas être celui qui vient de sortir
      if (dernier && pioche[0] === dernier && pioche.length > 1) {
        const j = 1 + hasard(pioche.length - 1);
        [pioche[0], pioche[j]] = [pioche[j], pioche[0]];
      }
      position = 0;
    }

    function chargerPioche() {
      try {
        const sauvegarde = JSON.parse(localStorage.getItem(CLE));
        // On réutilise la pioche seulement si la liste de défis n'a pas changé
        const memeListe = sauvegarde
          && Array.isArray(sauvegarde.pioche)
          && sauvegarde.pioche.length === tousLesDefis.length
          && sauvegarde.pioche.every(d => tousLesDefis.includes(d))
          && Number.isInteger(sauvegarde.position);
        if (memeListe) {
          pioche = sauvegarde.pioche;
          position = sauvegarde.position;
          return;
        }
      } catch (e) {}
      nouvellePioche(null);
      sauver();
    }

    function piocherDefi() {
      if (position >= pioche.length) nouvellePioche(pioche[pioche.length - 1]);
      const d = pioche[position++];
      sauver();
      return d;
    }

    chargerPioche();

    const card = document.getElementById('card');
    const btn = document.getElementById('actionBtn');
    let intervalId = null;
    let isRunning = false;
    let affiche = null;

    // Pendant le défilement : simple effet visuel, le vrai défi est tiré au STOP
    function defilement() {
      let d;
      do {
        d = tousLesDefis[hasard(tousLesDefis.length)];
      } while (d === affiche && tousLesDefis.length > 1);
      affiche = d;
      card.textContent = d;
    }

    // Couleurs de Noël
    const confettiColors = ['#d62839', '#ffffff', '#f5c451', '#ffd9de', '#ff5a6e'];

    function launchConfetti() {
      if (typeof confetti !== "function") return;

      confetti({ particleCount: 200, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors: confettiColors });
      confetti({ particleCount: 60, spread: 120, startVelocity: 35, shapes: ['star'], scalar: 1.1, origin: { y: 0.6 }, colors: ['#f5c451', '#ffffff'] });
      confetti({ particleCount: 100, spread: 160, startVelocity: 30, scalar: 1.2, origin: { y: 0.6 }, colors: confettiColors });

      const end = Date.now() + 2000;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors: confettiColors });
        confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors: confettiColors });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    // Au premier appui, on tente de passer en plein écran pour masquer les barres du téléphone.
    // Ça marche sur Android (Chrome) ; l'iPhone refuse, la page continue alors normalement.
    let pleinEcranTente = false;
    function pleinEcran() {
      if (pleinEcranTente) return;
      pleinEcranTente = true;
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req || document.fullscreenElement) return;
      try {
        const r = req.call(el, { navigationUI: 'hide' });
        if (r && r.catch) r.catch(() => {});
      } catch (e) {}
    }

    function toggleLoop() {
      pleinEcran();
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        // Le vrai défi est pioché dans la pioche mélangée
        card.textContent = piocherDefi();
        btn.textContent = "Recommencer";
        btn.classList.remove('running');
        card.classList.add('stopped');
        if (navigator.vibrate) navigator.vibrate(60);
        launchConfetti();
      } else {
        isRunning = true;
        btn.textContent = "Stop !";
        btn.classList.add('running');
        card.classList.remove('stopped', 'placeholder');
        intervalId = setInterval(defilement, 60);
      }
    }
